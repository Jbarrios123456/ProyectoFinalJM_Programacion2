<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alquileres - Rueda Libre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <nav class="nav nav-pills mb-4">
        <a class="nav-link" th:href="@{/clientes}">Clientes</a>
        <a class="nav-link" th:href="@{/equipos}">Equipos</a>
        <a class="nav-link active" th:href="@{/alquileres}">Alquileres</a>
    </nav>

    <h1 class="mb-4">Alquileres</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>

    <h4>Nueva reserva</h4>
    <form th:action="@{/alquileres/reservar}" method="post" class="row g-3 mb-4">
        <div class="col-md-6">
            <label class="form-label">Cliente</label>
            <select name="idCliente" class="form-select" required>
                <option value="">Seleccione un cliente</option>
                <option th:each="c : ${clientes}" th:value="${c.idCliente}"
                        th:text="${c.idCliente + ' - ' + c.nombre + ' (' + c.estado + ', saldo Q' + c.saldoPendiente + ')'}"></option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label">Hora estimada de devolucion</label>
            <input type="datetime-local" name="horaEstimada" class="form-control" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Equipos disponibles</label>
            <div class="form-check" th:each="e : ${equipos}">
                <input class="form-check-input" type="checkbox" name="equipos" th:value="${e.codigo}" th:id="${'eq' + e.codigo}">
                <label class="form-check-label" th:for="${'eq' + e.codigo}"
                       th:text="${e.codigo + ' - ' + e.tipo + ' ' + e.modelo + ' (Q' + e.tarifaHora + '/h)'}"></label>
            </div>
        </div>
        <div class="col-md-6">
            <label class="form-label">Accesorios (cantidad)</label>
            <div class="row g-2 mb-2" th:each="a : ${accesorios}">
                <div class="col-8">
                    <span th:text="${a.nombre + ' - Q' + a.tarifa + ' (disponibles: ' + a.existencia + ')'}"></span>
                </div>
                <div class="col-4">
                    <input type="number" min="0" class="form-control form-control-sm" th:name="${'cant_' + a.codigo}" placeholder="0">
                </div>
            </div>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Reservar</button>
        </div>
    </form>

    <table class="table table-striped table-bordered align-middle">
        <thead>
            <tr>
                <th>No.</th>
                <th>Cliente</th>
                <th>Estado</th>
                <th>Devolucion estimada</th>
                <th>Equipos</th>
                <th>Accesorios</th>
                <th>Deposito</th>
                <th>Total</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a : ${alquileres}">
                <td th:text="${a.idAlquiler}"></td>
                <td th:text="${a.cliente.nombre}"></td>
                <td th:text="${a.estado}"></td>
                <td th:text="${a.horaEstimadaTexto}"></td>
                <td th:text="${a.equiposTexto}"></td>
                <td th:text="${a.accesoriosTexto}"></td>
                <td th:text="${'Q' + a.deposito}"></td>
                <td th:text="${'Q' + a.total}"></td>
                <td>
                    <div class="d-flex gap-2">
                        <form th:if="${a.estado == 'RESERVADO'}" th:action="@{/alquileres/entregar/{id}(id=${a.idAlquiler})}" method="post">
                            <button type="submit" class="btn btn-primary btn-sm">Entregar</button>
                        </form>
                        <form th:if="${a.estado == 'RESERVADO'}" th:action="@{/alquileres/cancelar/{id}(id=${a.idAlquiler})}" method="post">
                            <button type="submit" class="btn btn-danger btn-sm">Cancelar</button>
                        </form>
                        <a th:if="${a.estado == 'ACTIVO'}" th:href="@{/alquileres/devolver/{id}(id=${a.idAlquiler})}" class="btn btn-warning btn-sm">Devolver</a>
                        <a th:if="${a.estado == 'FINALIZADO'}" th:href="@{/alquileres/comprobante/{id}(id=${a.idAlquiler})}" class="btn btn-secondary btn-sm">Comprobante</a>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
