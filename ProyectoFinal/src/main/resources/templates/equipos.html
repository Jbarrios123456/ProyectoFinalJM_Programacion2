<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Equipos - Rueda Libre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <nav class="nav nav-pills mb-4">
        <a class="nav-link" th:href="@{/clientes}">Clientes</a>
        <a class="nav-link active" th:href="@{/equipos}">Equipos</a>
    </nav>

    <h1 class="mb-4">Registro de Equipos</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${mensaje}" th:text="${mensaje}"></div>

    <form th:action="${editando} ? @{/equipos/actualizar} : @{/equipos/guardar}" method="post" class="row g-3 mb-4">
        <div class="col-md-2">
            <label class="form-label">Codigo</label>
            <input type="number" name="codigo" class="form-control" th:value="${equipo?.codigo}" th:readonly="${editando}" required>
        </div>
        <div class="col-md-3">
            <label class="form-label">Tipo</label>
            <select name="tipo" class="form-select" th:disabled="${editando}">
                <option value="BICICLETA_URBANA" th:selected="${equipo?.tipo == 'BICICLETA_URBANA'}">Bicicleta urbana</option>
                <option value="BICICLETA_MONTANA" th:selected="${equipo?.tipo == 'BICICLETA_MONTANA'}">Bicicleta de montana</option>
                <option value="SCOOTER" th:selected="${equipo?.tipo == 'SCOOTER'}">Scooter electrico</option>
            </select>
            <input type="hidden" name="tipo" th:if="${editando}" th:value="${equipo?.tipo}">
        </div>
        <div class="col-md-3">
            <label class="form-label">Modelo</label>
            <input type="text" name="modelo" class="form-control" th:value="${equipo?.modelo}" required>
        </div>
        <div class="col-md-2">
            <label class="form-label">Tarifa por hora (Q)</label>
            <input type="number" step="0.01" name="tarifaHora" class="form-control" th:value="${equipo?.tarifaHora}" required>
        </div>
        <div class="col-md-2">
            <label class="form-label">Precio reposicion (Q)</label>
            <input type="number" step="0.01" name="precioReposicion" class="form-control" th:value="${equipo?.precioReposicion}" required>
        </div>
        <div class="col-md-2">
            <label class="form-label">Bateria % (solo scooter)</label>
            <input type="number" name="bateria" class="form-control" min="0" max="100" th:value="${bateria}">
        </div>
        <div class="col-md-3 d-flex align-items-end gap-2">
            <button type="submit" class="btn btn-primary" th:text="${editando} ? 'Actualizar' : 'Guardar'">Guardar</button>
            <a th:if="${editando}" th:href="@{/equipos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>

    <table class="table table-striped table-bordered align-middle">
        <thead>
            <tr>
                <th>Codigo</th>
                <th>Tipo</th>
                <th>Modelo</th>
                <th>Tarifa/h</th>
                <th>Reposicion</th>
                <th>Deposito</th>
                <th>Bateria</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="e : ${equipos}">
                <td th:text="${e.codigo}"></td>
                <td th:text="${e.tipo}"></td>
                <td th:text="${e.modelo}"></td>
                <td th:text="${'Q' + e.tarifaHora}"></td>
                <td th:text="${'Q' + e.precioReposicion}"></td>
                <td th:text="${'Q' + e.deposito}"></td>
                <td th:text="${e.tipo == 'SCOOTER'} ? ${e.bateria + '%'} : '-'"></td>
                <td th:text="${e.estado}"></td>
                <td class="d-flex gap-2">
                    <a th:href="@{/equipos/editar/{codigo}(codigo=${e.codigo})}" class="btn btn-success btn-sm">Editar</a>
                    <form th:unless="${e.estado == 'DADO_DE_BAJA'}" th:action="@{/equipos/baja/{codigo}(codigo=${e.codigo})}" method="post">
                        <button type="submit" class="btn btn-danger btn-sm">Dar de baja</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
